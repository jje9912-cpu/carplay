      </button>

  <!-- 메인 컨테이너 -->
  <main class="max-w-lg mx-auto px-4 pt-4">

    <!-- [탭 1] 현장 작업 입력 폼 -->
    <section id="tab-input" class="space-y-4">

      <form id="mobile-form" onsubmit="handleMobileSubmit(event)" class="space-y-4">

        <!-- 1. 거래처 & 시공일자 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          <div class="grid grid-cols-5 gap-2.5">
            <div class="col-span-3">
              <label class="block text-xs font-bold text-slate-600 mb-1">거래처 (소속회사) *</label>
              <input type="text" id="m-company" required placeholder="예: K카, 개인/일반" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-bold text-slate-600 mb-1">시공일자</label>
              <input type="date" id="m-date" required class="w-full px-2.5 py-2.5 border border-slate-300 rounded-xl text-xs font-bold bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>
          <!-- 거래처 빠른 선택 버튼 -->
          <div id="company-chips" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- 2. 차량번호 & 차종 & 고객명 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">차량번호</label>
              <input type="text" id="m-carnum" placeholder="예: 12머1734" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm font-bold focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">차종</label>
              <input type="text" id="m-carmodel" placeholder="예: 싼타페, 카니발" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>
          <div id="car-chips" class="flex flex-wrap gap-1.5"></div>

          <div class="grid grid-cols-2 gap-2.5 pt-1 border-t border-slate-100">
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">고객명 (생략가능)</label>
              <input type="text" id="m-customer" placeholder="비워둬도 등록됨" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">연락처 (생략가능)</label>
              <input type="tel" id="m-phone" oninput="autoHyphenPhone(this)" maxlength="13" placeholder="010-0000-0000" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>
        </div>

        <!-- 3. 작업내역 & 빠른 단가 버튼 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">작업내역 (시공내용)</label>
            <button type="button" onclick="openPresetModal()" class="text-[11px] font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">⚙️ 버튼 편집</button>
          </div>
          <textarea id="m-content" rows="2" placeholder="예: 전면썬팅 35%, 열선재시공, 블랙박스 장착..." class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
          <div id="service-chips" class="flex flex-wrap gap-1.5"></div>
          <div class="text-[11px] text-slate-400">
            ※ 등록 시 작업내역 끝에 <strong id="worker-tag-preview" class="text-slate-600">[입력: 미지정]</strong>이 자동 표시되어 PC 장부에서도 작성자를 바로 확인할 수 있습니다.
          </div>
        </div>

        <!-- 3-2. 현장 사진 촬영/첨부 (자동 웹용 압축) -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <label class="text-xs font-bold text-slate-700">📸 시공 사진 첨부 <span class="text-[11px] font-normal text-slate-400">(최대 4장 · 구글드라이브)</span></label>
            <div class="flex items-center gap-1.5">
              <span id="photo-size-info" class="text-[11px] font-bold text-emerald-600"></span>
              <button type="button" onclick="promptGDriveUrl()" class="text-[10px] font-bold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md border border-slate-200">⚙️ 구글주소</button>
            </div>
          </div>

          <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handlePhotoFiles(event)" class="hidden">
          <input type="file" id="gallery-input" accept="image/*" multiple onchange="handlePhotoFiles(event)" class="hidden">

          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="document.getElementById('camera-input').click()" class="chip-btn py-2.5 px-3 bg-slate-900 active:bg-slate-800 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">

    // 스마트폰 원본 사진을 웹용(최대 1200px, JPEG 72%)으로 자동 리사이즈·압축
    function compressImageForWeb(file, maxSide = 1200, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('이미지 읽기 실패'));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error('이미지 디코딩 실패'));
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxSide || h > maxSide) {
              if (w >= h) {
                h = Math.round((h * maxSide) / w);
                w = maxSide;
              } else {
                w = Math.round((w * maxSide) / h);
                h = maxSide;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            canvas.toBlob((blob) => {
              if (!blob) return reject(new Error('웹용 압축 실패'));
              resolve({
                blob,
                previewUrl: URL.createObjectURL(blob),
                origSize: file.size,
                compSize: blob.size
              });
            }, 'image/jpeg', quality);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + 'B';
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + 'KB';
      return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
    }

    async function handlePhotoFiles(event) {
      const files = Array.from(event.target.files || []);
      event.target.value = '';
      if (!files.length) return;

      const remain = MAX_PHOTOS - pendingPhotos.length;
      if (remain <= 0) {
        showToast(`사진은 최대 ${MAX_PHOTOS}장까지 첨부할 수 있습니다.`, true);
        return;
      }

      const targets = files.slice(0, remain);
      showToast('웹용 크기로 자동 압축중...');
      for (const file of targets) {
        try {
          const item = await compressImageForWeb(file);
          pendingPhotos.push(item);
        } catch (err) {
          console.error(err);
          showToast('사진 처리 중 오류가 발생했습니다.', true);
        }
      }
      renderPhotoPreviews();
    }

    function removePendingPhoto(idx) {
      const removed = pendingPhotos.splice(idx, 1)[0];
      if (removed && removed.previewUrl) URL.revokeObjectURL(removed.previewUrl);
      renderPhotoPreviews();
    }

    function clearPendingPhotos() {
      pendingPhotos.forEach(p => p.previewUrl && URL.revokeObjectURL(p.previewUrl));
      pendingPhotos = [];
      renderPhotoPreviews();
    }

    function renderPhotoPreviews() {
      const grid = document.getElementById('photo-preview-grid');
      const info = document.getElementById('photo-size-info');
      if (pendingPhotos.length === 0) {
        grid.classList.add('hidden');
        grid.innerHTML = '';
        info.textContent = '';
        return;
      }
      const totalOrig = pendingPhotos.reduce((s, p) => s + p.origSize, 0);
      const totalComp = pendingPhotos.reduce((s, p) => s + p.compSize, 0);
      info.textContent = `${formatBytes(totalOrig)} → ${formatBytes(totalComp)}`;

      grid.classList.remove('hidden');
      grid.innerHTML = pendingPhotos.map((p, idx) => `
        <div class="relative aspect-square rounded-xl overflow-hidden border border-slate-200 bg-slate-100">
          <img src="${p.previewUrl}" onclick="openPhotoViewer('${p.previewUrl}')" class="w-full h-full object-cover cursor-pointer">
          <button type="button" onclick="removePendingPhoto(${idx})" class="absolute top-1 right-1 w-5 h-5 rounded-full bg-slate-900/80 text-white text-[10px] font-bold flex items-center justify-center">✕</button>
          <span class="absolute bottom-0.5 left-0.5 px-1 py-0.2 rounded bg-black/60 text-white text-[9px]">${formatBytes(p.compSize)}</span>
        </div>
      `).join('');
    }

    function promptGDriveUrl() {
      const cur = getGDriveUrl();
      const input = prompt('구글 드라이브 웹 앱 URL(https://script.google.com/macros/s/...)을 붙여넣어 주세요:', cur);
      if (input !== null) {
        localStorage.setItem(GDRIVE_URL_KEY, input.trim());
        showToast(input.trim() ? '✅ 구글 드라이브 주소가 저장되었습니다.' : '구글 드라이브 주소가 비워졌습니다.');
      }
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Base64 변환 실패'));
        reader.onloadend = () => {
          const res = String(reader.result || '');
          resolve(res.split(',')[1] || '');
        };
        reader.readAsDataURL(blob);
      });
    }

    async function uploadPendingPhotos(entryId) {
      if (pendingPhotos.length === 0) return [];
      const gdriveUrl = getGDriveUrl();
      if (!gdriveUrl) {
        promptGDriveUrl();
        throw new Error('구글 드라이브 웹 앱 주소가 설정되지 않았습니다. 주소를 입력한 뒤 다시 올려주세요.');
      }
      const urls = [];
      const today = new Date().toISOString().slice(0, 10);
      const carNum = (document.getElementById('m-carnum').value.trim() || '차량').replace(/[^0-9a-zA-Z가-힣_-]/g, '');
      for (let i = 0; i < pendingPhotos.length; i++) {
        const p = pendingPhotos[i];
        const base64 = await blobToBase64(p.blob);
        const filename = `${today}_${carNum}_${entryId}_${i + 1}.jpg`;
        const resp = await fetch(gdriveUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            folderName: '카플레이_시공사진',
            subFolder: today,
            filename: filename,
            mimeType: 'image/jpeg',
            base64: base64
          })
        });
        const result = await resp.json();
        if (!result || !result.ok || !result.url) {
          throw new Error('구글 드라이브 업로드 실패: ' + (result && result.error ? result.error : '응답 오류'));
        }
        urls.push(result.url);
      }
      return urls;
    }

    function extractPhotosFromContent(content) {
      const m = String(content || '').match(/\[사진:\s*([^\]]+)\]/);
      if (!m) return [];
      return m[1].split(',').map(s => s.trim()).filter(Boolean);
    }

    function openPhotoViewer(url) {
      const modal = document.getElementById('photo-viewer-modal');
      document.getElementById('photo-viewer-img').src = url;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closePhotoViewer() {
      const modal = document.getElementById('photo-viewer-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toDbRow(item) {
      const labor = Number(item.labor) || 0;
      const deposit = Number(item.deposit) || 0;
      if (dbSchemaType === 'short') {
        return {
          id: Number(item.id),
          company: item.company,
          customer: item.customer,
          phone: item.phone,
          car_num: item.carNum,
          service_date: item.date,
          work_content: item.content,
          labor: labor,
          deposit: deposit,
          method: item.method,
          car_model: item.carModel
        };
      }
      return {
        id: Number(item.id),
        company_name: item.company,
        customer_name: item.customer,
        phone: item.phone,
        car_number: item.carNum,
        service_date: item.date,
        service_content: item.content,
        labor_amount: labor,
        deposit_amount: deposit,
        payment_method: item.method,
        unpaid_amount: Math.max(0, labor - deposit),
        car_model: item.carModel
      };
    }

    function fromDbRow(row) {
      if (row.company !== undefined || row.car_num !== undefined || row.work_content !== undefined) {
        dbSchemaType = 'short';
      } else if (row.company_name !== undefined) {
        dbSchemaType = 'standard';
      }
      return {
        id: Number(row.id),
        company: row.company_name !== undefined ? row.company_name : (row.company || ''),
        customer: row.customer_name !== undefined ? row.customer_name : (row.customer || ''),
        phone: row.phone || '',
        carNum: row.car_number !== undefined ? row.car_number : (row.car_num || ''),
        date: row.service_date || '',
        content: row.service_content !== undefined ? row.service_content : (row.work_content || ''),
        labor: Number(row.labor_amount !== undefined ? row.labor_amount : (row.labor || 0)),
        deposit: Number(row.deposit_amount !== undefined ? row.deposit_amount : (row.deposit || 0)),
        method: row.payment_method !== undefined ? row.payment_method : (row.method || '미수'),
        carModel: row.car_model || ''
      };
    }

    function extractWorkerFromContent(content) {
      const m = String(content || '').match(/\[입력:\s*([^\]]+)\]/);
      return m ? m[1].trim() : '';
    }

    async function handleMobileSubmit(e) {
      e.preventDefault();
      if (!sbClient) {
        showToast('DB 연결이 되지 않았습니다. 인터넷을 확인하세요.', true);
        return;
      }
      if (!currentWorker) {
        openWorkerModal();
        showToast('먼저 작성자 이름을 설정해주세요!', true);
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = '⏳ 클라우드 DB에 저장중...';

      try {
        const entryId = Date.now() + Math.floor(Math.random() * 1000);
        let photoUrls = [];
        if (pendingPhotos.length > 0) {
          btn.textContent = `⏳ 웹용 사진 ${pendingPhotos.length}장 업로드중...`;
          photoUrls = await uploadPendingPhotos(entryId);
          btn.textContent = '⏳ 클라우드 DB에 저장중...';
        }

        const rawContent = document.getElementById('m-content').value.trim() || '-';
        const workerTag = `[입력: ${currentWorker}]`;
        let finalContent = rawContent.includes('[입력:') ? rawContent : (rawContent === '-' ? workerTag : `${rawContent} ${workerTag}`);
        if (photoUrls.length > 0) {
          finalContent = `${finalContent} [사진: ${photoUrls.join(', ')}]`;
        }

        const newEntry = {
          id: entryId,
          company: document.getElementById('m-company').value.trim() || '미지정',
          customer: document.getElementById('m-customer').value.trim() || '-',
          phone: document.getElementById('m-phone').value.trim() || '',
          carNum: document.getElementById('m-carnum').value.trim() || '-',
          date: document.getElementById('m-date').value || new Date().toISOString().slice(0, 10),
          content: finalContent,
          labor: Number(document.getElementById('m-labor').value) || 0,
          deposit: Number(document.getElementById('m-deposit').value) || 0,
          method: selectedMethod,
          carModel: document.getElementById('m-carmodel').value.trim() || '-'
        };

        let { error } = await sbClient.from('service_ledgers').upsert([toDbRow(newEntry)], { onConflict: 'id' });
        if (error && error.message && (error.message.includes('column') || error.message.includes('schema'))) {
          dbSchemaType = (dbSchemaType === 'standard') ? 'short' : 'standard';
          const retry = await sbClient.from('service_ledgers').upsert([toDbRow(newEntry)], { onConflict: 'id' });
          error = retry.error;
        }
        if (error) throw error;

        resetMobileForm();
        showToast('✅ 등록 완료! 매장 PC에 실시간 반영됨');
      } catch (err) {
        console.error(err);
        showToast('저장 오류: ' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = '☁️ 작업 전표 올리기';
      }
    }

    function switchTab(tab) {
      document.getElementById('tab-input').classList.toggle('hidden', tab !== 'input');
      document.getElementById('tab-recent').classList.toggle('hidden', tab !== 'recent');

      const btnInput = document.getElementById('nav-btn-input');
      const btnRecent = document.getElementById('nav-btn-recent');
      if (tab === 'input') {
        btnInput.className = 'py-3 flex flex-col items-center justify-center gap-0.5 text-blue-600 font-extrabold';
        btnRecent.className = 'py-3 flex flex-col items-center justify-center gap-0.5 text-slate-400 font-semibold';
      } else {
        btnInput.className = 'py-3 flex flex-col items-center justify-center gap-0.5 text-slate-400 font-semibold';
        btnRecent.className = 'py-3 flex flex-col items-center justify-center gap-0.5 text-blue-600 font-extrabold';
        loadRecentRecords();
      }
    }

    async function loadRecentRecords() {
      if (!sbClient) return;
      const listEl = document.getElementById('recent-list');
      listEl.innerHTML = '<div class="text-center py-10 text-xs text-slate-400">최신 내역 불러오는 중...</div>';

      const { data, error } = await sbClient
        .from('service_ledgers')
        .select('*')
        .order('id', { ascending: false })
        .limit(40);

      if (error) {
        listEl.innerHTML = `<div class="text-center py-10 text-xs text-rose-500">불러오기 실패: ${error.message}</div>`;
        return;
      }

      recentRowsCache = (data || []).map(fromDbRow);
      renderRecentList();
    }

    function renderRecentList() {
      const workersSet = new Set();
      recentRowsCache.forEach(r => {
        const w = extractWorkerFromContent(r.content);
        if (w) workersSet.add(w);
      });

      const filterBar = document.getElementById('recent-worker-filters');
      const allFilters = ['ALL', ...Array.from(workersSet)];
      filterBar.innerHTML = allFilters.map(w => `
        <button type="button" onclick="setRecentWorkerFilter('${w.replace(/'/g, "\\'")}')" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border ${activeWorkerFilter === w ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200'}">
          ${w === 'ALL' ? '전체 보기' : '👤 ' + w}
        </button>
      `).join('');

      const rows = activeWorkerFilter === 'ALL'
        ? recentRowsCache
        : recentRowsCache.filter(r => extractWorkerFromContent(r.content) === activeWorkerFilter);

      const listEl = document.getElementById('recent-list');
      if (rows.length === 0) {
        listEl.innerHTML = '<div class="text-center py-12 text-xs text-slate-400 bg-white rounded-2xl border border-slate-200">표시할 등록 내역이 없습니다.</div>';
        return;
      }

      listEl.innerHTML = rows.map(r => {
        const unpaid = Math.max(0, r.labor - r.deposit);
        const worker = extractWorkerFromContent(r.content);
        const photos = extractPhotosFromContent(r.content);
        const cleanContent = r.content
          .replace(/\[입력:\s*[^\]]+\]/g, '')
          .replace(/\[사진:\s*[^\]]+\]/g, '')
          .trim() || '-';
        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="font-extrabold text-sm text-slate-900">${r.company}</span>
                  ${r.customer && r.customer !== '-' ? `<span class="text-xs font-semibold text-slate-600">· ${r.customer}</span>` : ''}
                  ${worker ? `<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-extrabold">👤 ${worker}</span>` : `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 text-[10px] font-semibold">PC등록</span>`}
                </div>
                <div class="text-xs text-slate-500 mt-0.5">${r.date} · <span class="font-bold text-slate-700">${r.carNum}</span> (${r.carModel})</div>
              </div>
              <button type="button" onclick="deleteRecentRow(${r.id})" class="text-[11px] text-slate-400 hover:text-rose-600 px-2 py-1 rounded-lg bg-slate-50">삭제</button>
            </div>
            <div class="text-xs text-slate-700 bg-slate-50 px-3 py-2 rounded-xl border border-slate-100">${cleanContent}</div>
            ${photos.length > 0 ? `
              <div class="grid grid-cols-4 gap-1.5 pt-1">
                ${photos.map(url => `<img src="${url}" onclick="openPhotoViewer('${url}')" class="w-full aspect-square object-cover rounded-lg border border-slate-200 cursor-pointer">`).join('')}
              </div>
            ` : ''}
            <div class="flex items-center justify-between text-xs pt-1">
              <span class="font-semibold text-slate-500">공임 <strong class="text-blue-600">${formatNum(r.labor)}원</strong> · ${r.method}</span>
              <span class="font-extrabold ${unpaid > 0 ? 'text-rose-600' : 'text-emerald-600'}">${unpaid > 0 ? '미수 ' + formatNum(unpaid) + '원' : '완납'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function setRecentWorkerFilter(w) {
      activeWorkerFilter = w;
      renderRecentList();
    }

    async function deleteRecentRow(id) {
      if (!confirm('이 전표를 삭제하시겠습니까? (매장 PC 장부에서도 함께 삭제됩니다)')) return;
      const { error } = await sbClient.from('service_ledgers').delete().eq('id', Number(id));
      if (error) {
        showToast('삭제 오류: ' + error.message, true);
        return;
      }
      recentRowsCache = recentRowsCache.filter(r => Number(r.id) !== Number(id));
      renderRecentList();
      showToast('🗑️ 삭제되었습니다.');
    }

    // 빠른 버튼 편집 모달 로직
    function openPresetModal() {
      renderPresetEditor();
      const m = document.getElementById('preset-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }
    function closePresetModal() {
      const m = document.getElementById('preset-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }
    function renderPresetEditor() {
      document.getElementById('edit-comp-list').innerHTML = companyPresets.map((c, idx) => `
        <span class="inline-flex items-center gap-1 px-2.5 py-1 bg-slate-100 rounded-lg text-xs font-semibold">
          ${c} <button type="button" onclick="removeCompChip(${idx})" class="text-rose-500 font-bold ml-0.5">×</button>
        </span>
      `).join('');
      document.getElementById('edit-svc-list').innerHTML = servicePresets.map((s, idx) => `
        <div class="flex items-center justify-between px-3 py-1.5 bg-slate-50 rounded-xl border border-slate-200 text-xs">
          <span><strong>${s.name}</strong> (${formatNum(s.price)}원)</span>
          <button type="button" onclick="removeSvcChip(${idx})" class="text-rose-500 font-bold">삭제</button>
        </div>
      `).join('');
    }
    function addCompanyChip() {
      const v = document.getElementById('add-comp-input').value.trim();
      if (!v) return;
      companyPresets.push(v);
      localStorage.setItem(COMP_LIST_KEY, JSON.stringify(companyPresets));
      document.getElementById('add-comp-input').value = '';
      renderChips();
      renderPresetEditor();
    }
    function removeCompChip(idx) {
      companyPresets.splice(idx, 1);
      localStorage.setItem(COMP_LIST_KEY, JSON.stringify(companyPresets));
      renderChips();
      renderPresetEditor();
    }
    function addServiceChip() {
      const name = document.getElementById('add-svc-name').value.trim();
      const price = Number(document.getElementById('add-svc-price').value) || 0;
      if (!name) return;
      servicePresets.push({ name, price });
      localStorage.setItem(SVC_LIST_KEY, JSON.stringify(servicePresets));
      document.getElementById('add-svc-name').value = '';
      document.getElementById('add-svc-price').value = '';
      renderChips();
      renderPresetEditor();
    }
    function removeSvcChip(idx) {
      servicePresets.splice(idx, 1);
      localStorage.setItem(SVC_LIST_KEY, JSON.stringify(servicePresets));
      renderChips();
      renderPresetEditor();
    }

    // 초기화
    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('m-date').value = new Date().toISOString().slice(0, 10);
      renderChips();
      updateWorkerUI();

      // Supabase 연결 확인
      if (EMBEDDED_SB_URL && EMBEDDED_SB_KEY && window.supabase) {
        try {
          sbClient = window.supabase.createClient(EMBEDDED_SB_URL, EMBEDDED_SB_KEY);
          const { error } = await sbClient.from('service_ledgers').select('id').limit(1);
          if (!error) {
            document.getElementById('conn-dot').className = 'w-2 h-2 rounded-full bg-emerald-400';
            document.getElementById('conn-text').textContent = '매장 PC 실시간 연동됨';
          } else {
            document.getElementById('conn-dot').className = 'w-2 h-2 rounded-full bg-rose-500';
            document.getElementById('conn-text').textContent = 'DB 연결 오류';
          }
        } catch (err) {
          document.getElementById('conn-dot').className = 'w-2 h-2 rounded-full bg-rose-500';
          document.getElementById('conn-text').textContent = '네트워크 오류';
        }
      }

      // 처음 접속해서 작성자가 미지정이면 바로 이름 설정 팝업 표시
      if (!currentWorker) {
        setTimeout(() => openWorkerModal(), 300);
      }
    });
  </script>
</body>
